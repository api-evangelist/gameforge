aid: gameforge
name: Gameforge
description: >-
  Gameforge AG is a German publisher of free-to-play online and browser games,
  headquartered in Karlsruhe, Germany. Its catalog includes long-running titles
  such as OGame, Ikariam, Metin2, AION, NosTale, and other strategy and MMO games
  played across dozens of localized game servers. Gameforge's flagship title OGame
  exposes a public read-only game-data API that returns highscores, player and
  alliance rosters, universe/planet layouts, and per-server metadata as XML feeds
  (with an opt-in JSON representation), plus a separate access-controlled API that
  approved third-party tool developers can request for combat and report data.
  Gameforge also runs a coordinated vulnerability disclosure program through
  Bugcrowd. This profile was surfaced as a portfolio company of Accel and enriched
  by the API Evangelist pipeline.
